
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PACS Master Administration Console</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-surface: #12161f;
      --bg-card: #181e29;
      --accent: #8b5cf6;
      --accent-cyan: #00e5ff;
      --border: #273142;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #151a24; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 14px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
    .brand span { color: #fff; font-weight: 400; font-size: 12px; }
    
    .container { max-width: 1000px; margin: 24px auto; width: 95%; display: flex; flex-direction: column; gap: 20px; }
    
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .card h3 { font-size: 14px; color: var(--accent-cyan); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    input, select { background: var(--bg-card); border: 1px solid var(--border); border-radius: 5px; color: #fff; padding: 9px 12px; font-size: 12px; outline: none; transition: border 0.2s; }
    input:focus { border-color: var(--accent-cyan); }
    
    .btn { background: var(--accent); color: #fff; font-weight: 700; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-outline:hover { background: var(--bg-card); color: #fff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th { background: #161b24; color: var(--muted); font-size: 11px; text-transform: uppercase; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .ae-tag { background: rgba(0, 229, 255, 0.12); color: var(--accent-cyan); border: 1px solid rgba(0, 229, 255, 0.3); padding: 2px 6px; border-radius: 3px; font-weight: 700; font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚙️ PACS <span>MASTER ADMIN CONSOLE</span></div>
    <div style="display:flex; gap:10px; align-items:center;">
      <a href="/" class="btn btn-outline" style="text-decoration:none; padding:6px 12px; font-size:11.5px;">🖥️ Open Workstation</a>
      <button onclick="adminLogout()" class="btn" style="background:#ef4444; padding:6px 12px; font-size:11.5px;">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- Registration Form -->
    <div class="card">
      <h3>➕ Register New Doctor & Assign Destination AE Title</h3>
      <form id="regForm" onsubmit="submitDoctor(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Doctor Full Name</label>
            <input type="text" id="doc_name" placeholder="Dr. Rajesh Sharma" required>
          </div>
          <div class="form-group">
            <label>Assigned Called AE Title (Machine Routing)</label>
            <input type="text" id="doc_ae" placeholder="PACS_RAJESH" style="text-transform:uppercase;" required>
          </div>
          <div class="form-group">
            <label>Login Username</label>
            <input type="text" id="doc_user" placeholder="dr_rajesh" required>
          </div>
          <div class="form-group">
            <label>Login Password</label>
            <input type="password" id="doc_pass" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label>Hospital / Imaging Center</label>
            <input type="text" id="doc_hosp" placeholder="Apex Diagnostics Center">
          </div>
          <div class="form-group">
            <label>Medical Degrees / Registration No.</label>
            <input type="text" id="doc_deg" placeholder="MBBS, MD (Radiology)">
          </div>
        </div>
        <div style="margin-top:16px; display:flex; justify-content:flex-end;">
          <button type="submit" class="btn">Register & Bind Account</button>
        </div>
      </form>
    </div>

    <!-- Active Doctors List -->
    <div class="card">
      <h3>👥 Registered Doctors & Bound AE Titles</h3>
      <table>
        <thead>
          <tr><th>Doctor Name</th><th>Username</th><th>Assigned AE Title</th><th>Hospital</th><th>Status</th></tr>
        </thead>
        <tbody id="doctors-table-body">
          <tr><td colspan="5" style="color:var(--muted); text-align:center;">Loading registered doctors...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const adminUser = JSON.parse(localStorage.getItem('pacs_user') || '{}');
    if (!adminUser.username || adminUser.role !== 'ADMIN') {
      alert("Access Denied! Only Administrator can view this console.");
      window.location.href = "/";
    }

    async function loadDoctors() {
      // Load doctors list
      try {
        const res = await fetch('/api/admin/list-doctors?admin_username=' + encodeURIComponent(adminUser.username));
        if (!res.ok) return;
        const list = await res.json();
        const tbody = document.getElementById('doctors-table-body');
        tbody.innerHTML = '';
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--muted);">No doctors registered yet.</td></tr>';
          return;
        }
        list.forEach(d => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${d.doctor_name}</b></td>
            <td><code>${d.username}</code></td>
            <td><span class="ae-tag">${d.ae_title}</span></td>
            <td>${d.hospital_name || '--'}</td>
            <td><span style="color:#10b981; font-weight:600;">● Active</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {}
    }

    async function submitDoctor(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append("admin_username", adminUser.username);
      formData.append("username", document.getElementById('doc_user').value);
      formData.append("password", document.getElementById('doc_pass').value);
      formData.append("ae_title", document.getElementById('doc_ae').value);
      formData.append("doctor_name", document.getElementById('doc_name').value);
      formData.append("hospital_name", document.getElementById('doc_hosp').value);
      formData.append("degrees", document.getElementById('doc_deg').value);

      const res = await fetch('/api/admin/register-doctor', { method: 'POST', body: formData });
      const d = await res.json();
      if (!res.ok) return alert(d.detail || "Registration failed");
      alert(d.message);
      document.getElementById('regForm').reset();
      loadDoctors();
    }

    function adminLogout() {
      localStorage.removeItem('pacs_user');
      window.location.href = "/";
    }

    loadDoctors();
  </script>
</body>
</html>
