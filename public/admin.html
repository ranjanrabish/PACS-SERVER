<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PACS Master Admin Console</title>
  <style>
    :root {
      --bg-dark: #07090c;
      --bg-surface: #10141a;
      --bg-card: #151a21;
      --bg-hover: #1f2630;
      --accent: #c084fc;
      --accent-glow: rgba(192, 132, 252, 0.35);
      --border-color: #212936;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, Arial, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    h1 { color: var(--accent); font-size: 20px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    input, select { background: var(--bg-card); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; font-size: 12px; }
    button { background: var(--accent); color: #000; font-weight: bold; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .back-btn { background: #333f52; color: #fff; margin-bottom: 16px; display: inline-block; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-btn">⬅ Back to PACS Viewer</a>
    <h1>⚙️ Master Admin Console: Register New Doctor</h1>
    
    <form onsubmit="registerDoctor(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" required placeholder="doctor_username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" required placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>AE Title (DICOM Node Identifier)</label>
        <input type="text" id="reg-aetitle" required placeholder="DR_SMITH_AET">
      </div>
      <div class="form-group">
        <label>Doctor Full Name</label>
        <input type="text" id="reg-name" required placeholder="Dr. John Smith">
      </div>
      <div class="form-group">
        <label>Degrees / Qualifications</label>
        <input type="text" id="reg-degrees" placeholder="MBRD, MD (Radiology)">
      </div>
      <div class="form-group">
        <label>Hospital Name</label>
        <input type="text" id="reg-hospital" placeholder="City General Hospital">
      </div>
      <button type="submit">Register Doctor & AE Title</button>
    </form>
  </div>

  <script>
    async function registerDoctor(e) {
      e.preventDefault();
      const otpToken = sessionStorage.getItem('pacs_admin_otp_token');
      const adminUser = JSON.parse(localStorage.getItem('pacs_user') || '{}');

      if (!otpToken || adminUser.role !== 'ADMIN') {
        alert('Unauthorized or Session Expired. Please sign in again.');
        window.location.href = '/';
        return;
      }

      const formData = new FormData();
      formData.append('admin_username', adminUser.username);
      formData.append('otp_token', otpToken);
      formData.append('username', document.getElementById('reg-username').value.trim());
      formData.append('password', document.getElementById('reg-password').value);
      formData.append('ae_title', document.getElementById('reg-aetitle').value.trim().toUpperCase());
      formData.append('doctor_name', document.getElementById('reg-name').value.trim());
      formData.append('degrees', document.getElementById('reg-degrees').value.trim());
      formData.append('hospital_name', document.getElementById('reg-hospital').value.trim());

      try {
        const res = await fetch('/api/admin/register-doctor', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        alert(data.message);
        e.target.reset();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
